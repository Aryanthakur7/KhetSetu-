[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khetsetu-frontend"
dynamic = ["version"]
description = "KhetSetu frontend: Gradio UI that talks to services only through contracts."
requires-python = ">=3.12,<3.13"
# The frontend depends on contracts only and NEVER on the backend distribution (B-01).
# gradio is pinned exactly: the Space sdk_version (plan 01-06) is derived from the lock
# and must equal this pin.
dependencies = [
    "khetsetu-contracts",
    "gradio==6.30.0",
]

[tool.uv.sources]
khetsetu-contracts = { workspace = true }

[tool.hatch.version]
path = "src/khetsetu_frontend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khetsetu_frontend"]
