[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khetsetu-backend"
dynamic = ["version"]
description = "KhetSetu backend: services, inference, data and CLI (no UI code)."
requires-python = ">=3.12,<3.13"
# Runtime dependencies for the whole of Phase 1, declared once so the lockfile is
# created once and later plans do not edit dependency tables.
dependencies = [
    "khetsetu-contracts",
    "pydantic>=2.11.10,<3",
    "pydantic-settings>=2.16.1,<3",
    "pillow>=12,<13",
    "typer>=0.27.3,<1",
]

[project.scripts]
khetsetu = "khetsetu_backend.cli:app"

[project.optional-dependencies]
# Training and development only; the Space never installs this extra.
data = [
    "huggingface-hub>=2.3.0,<3",
    "pyarrow>=26.0.0,<27",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
khetsetu-contracts = { workspace = true }

[tool.hatch.version]
path = "src/khetsetu_backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/khetsetu_backend"]
