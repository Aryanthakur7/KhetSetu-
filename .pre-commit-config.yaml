# Local pre-commit gates (FND-04, OPS-03, FND-02). Install once per clone with `make hooks`.
# Every external rev is pinned to a release tag; bump with `git ls-remote --tags <repo>`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # OPS-03: nobody commits parquet/weights. uv.lock is the one legitimate large file.
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # matches the ruff locked in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: scripts/gitleaks.sh staged
        language: system
        pass_filenames: false
